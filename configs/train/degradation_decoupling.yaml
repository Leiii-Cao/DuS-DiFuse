model:
  dus_difuse:
    target: dus_difuse.model.dus_difuse.DuSDiFuseModel
    params:
      latent_scale_factor: 0.18215
      use_gfcm: false
      unet_cfg:
        use_checkpoint: True
        image_size: 32
        in_channels: 8
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1280
        legacy: False
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        pretrained_path: "weights/mda.pth"

  diffusion:
    target: dus_difuse.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: True
      parameterization: v



train:
  seed: 231
  crop_size: 256
  divisor: 64
  clip_size: 224
  dataset_root: "data/GDFusion/train"
  sd_path: "weights/v2-1_512-ema-pruned.ckpt"
  exp_dir: "experiments/sde"
  learning_rate: 1e-5
  batch_size: 64
  num_workers: 8
  drop_last: true
  train_steps: 1000000
  log_every: 100
  ckpt_every: 10000
  unetresume: ~
  motion_kernel_path: ~
