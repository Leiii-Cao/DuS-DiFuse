model:
  embed_dim: 1024
  num_classes: 13
  vision_cfg:
    image_size: 224
    layers: 32
    width: 1280
    head_width: 80
    patch_size: 14
  text_cfg:
    context_length: 77
    vocab_size: 49408
    width: 1024
    heads: 16
    layers: 24

train:
  seed: 231
  dataset_root: "data/GDFusion/train"
  exp_dir: "experiments/mda"

  # Generic ViT-H-14 OpenCLIP initialization used for MDA training.
  init_path: "weights/open_clip_pytorch_model.bin"
  resume: ~

  crop_size: 256
  batch_size: 8
  num_workers: 4
  drop_last: true
  epochs: 300

  learning_rate_backbone: 1.0e-4
  learning_rate_head: 1.0e-4
  weight_decay: 1.0e-4
  regression_weight: 10.0
  max_grad_norm: 1.0

  log_every: 20
  save_every: 10
  motion_kernel_path: ~
