model:
  dus_difuse:
    target: dus_difuse.model.dus_difuse.DuSDiFuseModel
    params:
      latent_scale_factor: 0.18215
      use_gfcm: false
      unet_cfg: null
      clip_cfg: null
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_text_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: penultimate
      controlnet_cfg:
        use_checkpoint: true
        image_size: 32
        in_channels: 4
        hint_channels: 8
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        legacy: false
      SD_unet_cfg:
        use_checkpoint: true
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        legacy: false
  diffusion:
    target: dus_difuse.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: true
      parameterization: v

train:
  seed: 231
  image_roots:
    - data/generation/train/images
  image_ratios: [1]
  label_root: data/generation/train/labels
  class_names:
    0: person
    1: bicycle
    2: car
    3: motorcycle
    4: airplane
    5: bus
    6: train
    7: truck
    8: boat
    95: building
    105: clouds
    141: plant
    148: road
    156: sky
    168: tree
  label_all_one_prob: 0.5
  prompt_drop_prob: 0.2
  mask_drop_prob: 0.9
  divisor: 64
  max_size: 640
  sd_path: weights/v2-1_512-ema-pruned.ckpt
  resume: null
  motion_kernel_path: null
  exp_dir: experiments/generation
  learning_rate: 1.0e-5
  batch_size: 32
  gradient_accumulation_steps: 4
  num_workers: 4
  drop_last: true
  train_steps: 1000000
  log_every: 100
  ckpt_every: 10000
